  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; }
    /* celular em pé: pede para deitar o aparelho (o jogo é na horizontal). Só desenho, sem texto, vale em qualquer idioma (RN-88) */
    #gire { display: none; position: fixed; inset: 0; z-index: 10; background: #0b1020; align-items: center; justify-content: center; }
    #gire div { width: 70px; height: 120px; border: 6px solid #93c5fd; border-radius: 14px; animation: gire 1.8s ease-in-out infinite; }
    #gire div::after { content: ''; display: block; width: 16px; height: 4px; margin: 100px auto 0; background: #93c5fd; border-radius: 2px; }
    @keyframes gire { 0%, 25% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
    @media (orientation: portrait) and (pointer: coarse) { #gire { display: flex; } }
  </style>
  <!-- Phaser fica dentro do projeto (lib/): o Poki não deixa o jogo buscar nada em outros sites -->
  <script src="lib/phaser.min.js"></script>
</head>
